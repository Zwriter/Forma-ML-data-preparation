name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/engine/pyproject.toml

      - name: Install engine and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run engine tests
        run: python -m pytest tests/unit tests/contract tests/integration tests/performance

      - name: Check engine lint
        run: python -m ruff check .

      - name: Check engine formatting
        run: python -m ruff format --check .

  desktop:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run desktop tests
        run: npm test

      - name: Build desktop app
        run: npm run build

      - name: Check desktop formatting
        run: npm run format:check

      - name: Check source file limits
        working-directory: .
        shell: pwsh
        run: ./app/scripts/check_source_limits.ps1
